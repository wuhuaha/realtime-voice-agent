[project]
name = "realtime-voice-agent-repository-tools"
version = "0.1.0"
description = "Repository validation tools for realtime-voice-agent."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml==6.0.2",
]

[dependency-groups]
dev = [
  "jsonschema==4.25.1",
  "pytest==8.4.1",
  "ruff==0.12.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = [
  "tests/repository",
  "tests/contract",
  "tests/compatibility",
  "tests/protocol",
  "firmware/targets/lichuang-dev/tests",
  "firmware/tools/tests",
]
addopts = ["-q", "--strict-markers", "-p", "no:cacheprovider"]
