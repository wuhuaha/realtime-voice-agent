version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      repository-tools:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /clients/desktop_reference
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      desktop-reference:
        patterns: ["*"]
