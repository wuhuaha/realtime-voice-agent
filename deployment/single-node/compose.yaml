name: realtime-voice-agent

x-app-defaults: &app-defaults
  image: ${VOICE_SERVER_IMAGE:-realtime-voice-agent-server:local}
  build:
    context: ../..
    dockerfile: deployment/single-node/Dockerfile
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  redis:
    image: ${VOICE_REDIS_IMAGE:-redis:7.4.5-alpine}
    user: redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - redis-data:/data
    networks:
      - coordination
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  director:
    <<: *app-defaults
    command: ["session-director"]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${VOICE_DIRECTOR_PUBLISH_BIND:-127.0.0.1}:${VOICE_DIRECTOR_PUBLISH_PORT:-8080}:8080/tcp"
    environment:
      VOICE_ENV: production
      VOICE_DIRECTOR_BIND_HOST: 0.0.0.0
      VOICE_DIRECTOR_BIND_PORT: "8080"
      VOICE_COORDINATION_BACKEND: redis
      VOICE_REDIS_URL: redis://redis:6379/0
      VOICE_REDIS_CONNECT_TIMEOUT_SECONDS: ${VOICE_REDIS_CONNECT_TIMEOUT_SECONDS:-1}
      VOICE_REDIS_COMMAND_TIMEOUT_SECONDS: ${VOICE_REDIS_COMMAND_TIMEOUT_SECONDS:-1}
      VOICE_COORDINATION_PREFIX: ${VOICE_COORDINATION_PREFIX:-realtime-voice-agent}
      VOICE_INTERNAL_TOKEN: ${VOICE_INTERNAL_TOKEN:?set VOICE_INTERNAL_TOKEN in .env}
      VOICE_GRANT_SIGNING_KEY: ${VOICE_GRANT_SIGNING_KEY:?set VOICE_GRANT_SIGNING_KEY in .env}
      VOICE_ALLOW_SHARED_BOOTSTRAP_AUTH: "false"
      VOICE_DEVICE_CREDENTIALS: ${VOICE_DEVICE_CREDENTIALS:?set VOICE_DEVICE_CREDENTIALS in .env}
    networks:
      - coordination
      - worker-control
      - edge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    <<: *app-defaults
    command: ["realtime-worker"]
    depends_on:
      director:
        condition: service_healthy
    ports:
      - "${VOICE_WORKER_PUBLISH_BIND:-127.0.0.1}:${VOICE_WORKER_PUBLISH_PORT:-8081}:8081/tcp"
      - "${VOICE_UDP_PUBLISH_BIND:-0.0.0.0}:${VOICE_UDP_PUBLIC_PORT:-8092}:8092/udp"
    environment:
      VOICE_ENV: production
      VOICE_WORKER_ID: ${VOICE_WORKER_ID:-worker-single-1}
      VOICE_WORKER_BIND_HOST: 0.0.0.0
      VOICE_WORKER_BIND_PORT: "8081"
      VOICE_WORKER_MAX_SESSIONS: ${VOICE_WORKER_MAX_SESSIONS:-5}
      VOICE_DIRECTOR_URL: http://director:8080
      VOICE_HEARTBEAT_ENABLED: "true"
      VOICE_HEARTBEAT_INTERVAL_SECONDS: ${VOICE_HEARTBEAT_INTERVAL_SECONDS:-5}
      VOICE_SHUTDOWN_DRAIN_TIMEOUT_SECONDS: ${VOICE_SHUTDOWN_DRAIN_TIMEOUT_SECONDS:-10}
      VOICE_AGENT_CLOSE_STAGE_TIMEOUT_SECONDS: ${VOICE_AGENT_CLOSE_STAGE_TIMEOUT_SECONDS:-2}
      VOICE_INTERNAL_TOKEN: ${VOICE_INTERNAL_TOKEN:?set VOICE_INTERNAL_TOKEN in .env}
      VOICE_GRANT_SIGNING_KEY: ${VOICE_GRANT_SIGNING_KEY:?set VOICE_GRANT_SIGNING_KEY in .env}
      VOICE_ALLOW_LAB_AUTH: "false"
      VOICE_RVA_ENABLED: "true"
      VOICE_RVA_PUBLIC_WS_URL: ${VOICE_RVA_PUBLIC_WS_URL:?set VOICE_RVA_PUBLIC_WS_URL in .env}
      VOICE_RVA_UDP_ENABLED: ${VOICE_RVA_UDP_ENABLED:-true}
      VOICE_UDP_BIND_HOST: 0.0.0.0
      VOICE_UDP_BIND_PORT: "8092"
      VOICE_UDP_ADVERTISE_HOST: ${VOICE_UDP_ADVERTISE_HOST:?set VOICE_UDP_ADVERTISE_HOST in .env}
      VOICE_UDP_ADVERTISE_PORT: ${VOICE_UDP_PUBLIC_PORT:-8092}
      VOICE_UDP_PROBE_TIMEOUT_SECONDS: ${VOICE_UDP_PROBE_TIMEOUT_SECONDS:-3}
      VOICE_UDP_SESSION_LIFETIME_SECONDS: ${VOICE_UDP_SESSION_LIFETIME_SECONDS:-600}
      VOICE_UDP_QUEUE_DATAGRAMS: ${VOICE_UDP_QUEUE_DATAGRAMS:-32}
      VOICE_UDP_REORDER_WAIT_MS: ${VOICE_UDP_REORDER_WAIT_MS:-30}
      VOICE_RUNNER: ${VOICE_RUNNER:-livekit}
      VOICE_LLM_BASE_URL: ${VOICE_LLM_BASE_URL:-https://api.deepseek.com}
      VOICE_LLM_API_KEY: ${VOICE_LLM_API_KEY:?set VOICE_LLM_API_KEY in .env}
      VOICE_LLM_MODEL: ${VOICE_LLM_MODEL:-deepseek-v4-flash}
      VOICE_FUNASR_URL: ${VOICE_FUNASR_URL:?set VOICE_FUNASR_URL in .env}
      VOICE_FUNASR_PROTOCOL: ${VOICE_FUNASR_PROTOCOL:-standalone}
      VOICE_TTS_PROVIDER: ${VOICE_TTS_PROVIDER:-remote_cosyvoice}
      VOICE_TTS_QUEUE_TIMEOUT_SECONDS: ${VOICE_TTS_QUEUE_TIMEOUT_SECONDS:-0.25}
      VOICE_COSYVOICE_URL: ${VOICE_COSYVOICE_URL:?set VOICE_COSYVOICE_URL in .env}
      VOICE_COSYVOICE_MODEL: ${VOICE_COSYVOICE_MODEL:-cosyvoice3}
      VOICE_COSYVOICE_VOICE: ${VOICE_COSYVOICE_VOICE:-mumu}
      VOICE_VAD_ACTIVATION_THRESHOLD: ${VOICE_VAD_ACTIVATION_THRESHOLD:-0.60}
      VOICE_ASR_RECORDING_ENABLED: ${VOICE_ASR_RECORDING_ENABLED:-false}
    networks:
      - worker-control
      - edge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s

networks:
  coordination:
    internal: true
  worker-control:
    internal: true
  edge: {}

volumes:
  redis-data: {}
