schema_version: 2
control_protocols:
  - id: xiaozhi-control-v1
    transport: websocket
    path: /v1/xiaozhi
    version_header: Protocol-Version
    version: "1"
    contract: xiaozhi_control_v1/messages.schema.json
    status: legacy-baseline
  - id: rva-control-v1
    transport: websocket
    path: /v1/voice
    version: "1"
    contract: rva_control_v1/contract.yaml
    schema: rva_control_v1/messages.schema.json
    status: current
media_profiles:
  - id: wss-opus-v1
    controls: [xiaozhi-control-v1]
    carrier: websocket-binary
    codec: opus
    sample_rate_hz: 16000
    channels: 1
    frame_duration_ms: 60
    status: baseline
  - id: wss-opus-v2
    controls: [rva-control-v1]
    carrier: websocket-binary
    codec: opus
    sample_rate_hz: 16000
    channels: 1
    frame_duration_ms: 60
    status: current
    wire: rva_control_v1/contract.yaml
  - id: udp-opus-gcm-v1
    controls: [xiaozhi-control-v1, rva-control-v1]
    carrier: udp
    codec: opus
    sample_rate_hz: 16000
    channels: 1
    frame_duration_ms: 60
    status: current
    wire: udp_opus_gcm_v1/README.md
