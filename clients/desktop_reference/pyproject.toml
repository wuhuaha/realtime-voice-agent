[project]
name = "rva-desktop"
version = "0.1.0"
description = "Desktop reference endpoint for Realtime Voice Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==50.0.0",
  "httpx==0.28.1",
  "websockets==17.0.1",
]

[project.scripts]
rva-desktop = "rva_desktop.cli:main"

[project.optional-dependencies]
opus = [
  "av==18.0.0",
]
interactive = [
  "av==18.0.0",
  "sounddevice==0.5.5",
]
test = [
  "av==18.0.0",
  "jsonschema==4.26.0",
  "pytest>=8.3,<10",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rva_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "-p", "no:cacheprovider"]
asyncio_mode = "auto"
markers = [
  "e2e_host: independent Director and Worker process path",
]
pythonpath = ["src", "../../server/packages/voice_testkit/src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
