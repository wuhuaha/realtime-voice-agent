  - id: final-overlay-clean-build
    behavior: overlay 0001 through 0010 clean build and size
    evidence: build_passed
    applies_to: cf1950d
  - id: delivery-reference-clean-build
    behavior: 新仓独立 materialize 后应用 0001 through 0010 并完成 clean build/size
    evidence: build_passed
    applies_to: cf9bc69
    result: 2215/2215, image 0x2d2660, app remaining 28%, DIRAM 50.0%
    note: Artifact embeds ignored local configuration and is not publishable.
  - id: delivery-reference-flash-boot
    behavior: 完整 reference artifact 烧录、cold boot、Wi-Fi 与硬件/音频算法初始化
    evidence: device_verified
    applies_to: cf9bc69
    result: COM11 ESP32-S3 rev0.2 with 8 MiB PSRAM; IP 192.168.1.105; no panic/WDT observed
