    note: Sustained WSS media and device acoustic ASR/TTS/downlink playout were not proven in this run.
  - id: delivery-reference-udp-probe
    behavior: UDP GCM authenticated probe and ready transition
    evidence: device_verified
    applies_to: cf9bc69
