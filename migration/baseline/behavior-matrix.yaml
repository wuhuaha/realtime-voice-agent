schema_version: 2
purpose: Minimal rollback behavior oracle; current release evidence lives in docs/quality/release-readiness.md.

baseline:
  - id: legacy-wss-voice-loop
    behavior: Wi-Fi/bootstrap, AEC capture, WSS Opus, ASR/text/TTS playout and interruption
    evidence: historical_device_verified
    role: rollback_oracle
    excluded_scope:
      - current_native_artifact
      - release_slo
      - weak_network
      - stability

  - id: legacy-udp-wire
    behavior: udp-opus-gcm-v1 byte layout, AEAD vectors, probe and generation fence
    evidence: contract_verified
    role: canonical_compatibility_oracle
    authoritative_files:
      - protocol/udp_opus_gcm_v1/README.md
      - protocol/udp_opus_gcm_v1/fixtures/positive.json
      - protocol/udp_opus_gcm_v1/fixtures/negative.json

  - id: native-parity-gate
    behavior: Native endpoint must match the affected legacy behavior before compatibility code is retired.
    evidence: not_run
    required_scope:
      - clean_build_and_size
      - display_and_touch
      - wifi_nvs_and_bootstrap
      - wss_voice_loop
      - udp_voice_loop
      - aec_and_interruption
      - twenty_turns
      - thirty_minute_stability
